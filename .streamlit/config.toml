[browser]
# ¡CLAVE! Oculta el botón 'Fork' y el icono de GitHub/código
showSidebarNavigation = false
hideToolbar = true

# Otras configuraciones que ya añadimos
gatherUsageStats = false

[ui]
hideSidebarNav = false # Mantenlo en false si quieres la barra lateral (si tienes multi-página)
hideMainMenu = true    # Oculta el menú de hamburguesa (☰)

[global]
disableWatchdog = false

[ui]
# Esta línea es la clave para el pie de página
hideFooter = true